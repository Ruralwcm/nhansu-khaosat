<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Rà soát định biên nhân sự</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<style>
:root{--red:#d71920;--blue:#1a3c6e;--green:#16a34a;--gold:#f59e0b;--bg:#f4f5f7;--card:#fff;--txt:#1f2937;--muted:#6b7280;--border:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',-apple-system,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;padding-bottom:100px}
.topbar{background:linear-gradient(135deg,var(--red),#a31016);color:#fff;padding:10px 14px}
.topbar .t-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar .t{font-size:16px;font-weight:800;line-height:1.2}.topbar .v{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
.topbar .dash-btn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.topbar .dash-btn:hover{background:rgba(255,255,255,.28)}
.topbar .back-btn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;display:none}

.main-tabs{display:flex;gap:0;max-width:640px;margin:8px auto 0;padding:0 12px}
.main-tab{flex:1;padding:10px 12px;border:1px solid #d1d5db;background:#f9fafb;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:.2s;font-family:inherit}
.main-tab:first-child{border-radius:10px 0 0 10px}
.main-tab:last-child{border-radius:0 10px 10px 0}
.main-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab-view{display:none}
.tab-view.active{display:block}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-top:12px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:700;font-size:15px;border-bottom:1px solid var(--border)}
.card-head .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex-shrink:0}
.card-head .tag{margin-left:auto;font-size:11px;background:#eef2f7;padding:3px 8px;border-radius:20px;color:var(--muted)}
.card-body{padding:14px 16px}
label{display:block;font-size:12px;font-weight:600;color:#374151;margin:8px 0 3px}
label:first-child{margin-top:0}
label .r{color:var(--red)}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,60,110,.12)}
select:disabled{background:#f1f5f9;color:#94a3b8}
.row{display:flex;gap:8px}.row>div{flex:1;min-width:0}
.store-info{background:#f0fdf4;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12px;display:none}

.btn{display:inline-flex;align-items:center;gap:4px;padding:10px 16px;border-radius:9px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-block{width:100%;margin-top:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Employee table */
.emp-card{border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:6px;background:#fafbfc;font-size:12px}
.emp-card .emp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0;border-bottom:1px solid #f0f0f0}
.emp-card .emp-row:last-child{border-bottom:none}
.emp-row .emp-name{flex:1;min-width:120px;font-weight:600}
.emp-row .emp-title{color:var(--muted);font-size:11px;min-width:80px}
.emp-row .sys-badge{font-size:10px;padding:2px 7px;border-radius:10px;white-space:nowrap;font-weight:600}
.sys-badge.working{background:#dcfce7;color:var(--green)}
.sys-badge.leave{background:#fee2e2;color:var(--red)}
.sys-badge.other{background:#fef3c7;color:#d97706}

/* Confirm buttons */
.cf-btn-group{display:flex;gap:4px;align-items:center}
.cf-btn{padding:4px 10px;border-radius:6px;border:1px solid #d0dae4;background:#fff;font-size:11px;font-weight:600;cursor:pointer;color:#607085;transition:all .15s;white-space:nowrap;font-family:inherit}
.cf-btn:hover{opacity:.85}
.cf-btn.cf-ok{background:var(--green);color:#fff;border-color:var(--green)}
.cf-btn.cf-err{background:var(--red);color:#fff;border-color:var(--red)}
.cf-extra{background:#fffbf5;border:1px solid #fde68a;border-radius:6px;padding:8px;margin-top:4px;display:none}
.cf-extra.show{display:block}
.cf-extra select{padding:5px 6px;font-size:11px;width:100%;margin-bottom:4px;border:1px solid var(--border);border-radius:5px}
.cf-date-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.cf-date{flex:1;padding:4px 6px;font-size:11px;border:1px solid var(--border);border-radius:5px;min-width:95px}
.cf-date-lbl{font-size:10px;color:var(--muted);font-weight:600;display:block}
.cf-hr{margin-top:6px;font-size:11px;display:flex;align-items:center;gap:4px}
.cf-update-btn{font-size:10px;padding:4px 10px;border-radius:5px;background:var(--blue);color:#fff;border:none;cursor:pointer;margin-top:6px;font-family:inherit}

/* Confirm modal */
.confirm-box{background:#f0fdf4;border:2px solid var(--green);border-radius:12px;padding:16px;margin-top:10px}
.confirm-acts{display:flex;gap:8px;margin-top:12px}
.confirm-acts .btn{flex:1}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.hint{font-size:10px;color:var(--muted);margin-top:3px}

/* Dashboard extras */
.tag-sm{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600}
.tag-sm.ok{background:#dcfce7;color:var(--green)}
.tag-sm.warn{background:#fef3c7;color:#d97706}
.tag-sm.bad{background:#fee2e2;color:var(--red)}
.bar-wrap{width:55px;height:6px;background:#e5e7eb;border-radius:3px;display:inline-block;vertical-align:middle;margin-left:4px}
.bar{display:block;height:100%;border-radius:3px;min-width:2px}
.bar.blue{background:var(--blue)}
.bar.red{background:var(--red)}
.bar.green{background:var(--green)}
.bar.gold{background:var(--gold)}

/* Empty state */
.empty-msg{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}
.spinner{width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:var(--blue);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.saved-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 8px;border-radius:10px;background:#dcfce7;color:var(--green);font-weight:600}
.saved-badge.sai{background:#fef3c7;color:#d97706}
.edit-link{font-size:10px;color:var(--blue);cursor:pointer;margin-left:4px;text-decoration:underline}

@media(max-width:600px){
  .topbar .t{font-size:14px}
  .emp-row{flex-direction:column;align-items:flex-start!important;gap:2px!important;padding:8px 0!important}
  .emp-row .emp-name{font-size:13px}
  .cf-btn-group{margin-top:4px}
  .cf-date-wrap{flex-direction:column}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="t-row">
    <div><span class="t">🏪 Rà soát định biên nhân sự</span><span class="v">v12</span></div>
    <button class="dash-btn" id="btnDash" onclick="goDash()">📊 Dashboard</button>
    <button class="back-btn" id="btnBack" onclick="goSurvey()">↩ Quay lại</button>
  </div>
</div>

<!-- Tab: Khảo sát -->
<div class="tab-view active" id="tabSurvey">
<div class="wrap">
  <!-- ① CH Selection -->
  <div class="card">
    <div class="card-head"><span class="dot"></span>① Cửa hàng</div>
    <div class="card-body">
      <div class="row">
        <div><label>Miền <span class="r">*</span></label><select id="sm"><option>-- Đang tải --</option></select></div>
        <div><label>GĐV <span class="r">*</span></label><select id="sg" disabled><option>-- Chọn GĐV --</option></select></div>
        <div><label>QLKV <span class="r">*</span></label><select id="sq" disabled><option>-- Chọn QLKV --</option></select></div>
      </div>
      <label>Cửa hàng <span class="r">*</span></label>
      <select id="sc" disabled><option>-- Chọn CH --</option></select>
      <div class="store-info" id="si">Mã: <b id="sMa">-</b> · Tỉnh: <b id="sTinh">-</b> · <b id="sTen">-</b></div>
    </div>
  </div>

  <!-- ② Employee Survey -->
  <div class="card" id="empCard" style="display:none">
    <div class="card-head"><span class="dot" style="background:var(--blue)"></span>② Nhân sự <span class="tag" id="empCount" style="margin-left:auto">0 NV</span></div>
    <div class="card-body" id="empArea"><div class="empty-msg"><div class="spinner"></div>Đang tải dữ liệu nhân sự...</div></div>
  </div>

  <!-- ③ Save -->
  <div class="card" id="saveCard" style="display:none">
    <div class="card-head"><span class="dot" style="background:var(--green)"></span>③ Lưu khảo sát</div>
    <div class="card-body" id="saveArea">
      <div id="saveBtnWrap" style="text-align:right">
        <span id="saveMsg" style="font-size:12px;color:var(--green);font-weight:600;margin-right:10px"></span>
        <button class="btn btn-blue" id="saveBtn" onclick="triggerSave()">💾 Lưu Khảo sát</button>
      </div>
      <div id="confirmWrap" style="display:none"></div>
    </div>
  </div>
</div>
</div>

<!-- Tab: Dashboard -->
<div class="tab-view" id="tabDash" style="min-height:400px">
  <div class="wrap" style="text-align:center;color:var(--muted);padding:80px 20px">
    <div style="font-size:40px;margin-bottom:12px">🔒</div>
    <div style="font-size:16px;font-weight:600;margin-bottom:8px">Vui lòng đăng nhập để xem Dashboard</div>
    <label style="text-align:left;max-width:280px;margin:8px auto">User</label>
    <input type="text" id="dUsr" placeholder="Nhập user" style="max-width:280px;margin:0 auto 8px;display:block" autocomplete="off">
    <label style="text-align:left;max-width:280px;margin:8px auto">Password</label>
    <input type="password" id="dPwd" placeholder="Nhập password" style="max-width:280px;margin:0 auto 8px;display:block" autocomplete="off" onkeydown="if(event.key==='Enter')dashLogin()">
    <div class="err" id="dashErr" style="color:var(--red);font-size:12px;margin-bottom:8px;display:none">Sai thông tin đăng nhập!</div>
    <button class="btn btn-blue" onclick="dashLogin()" style="margin-top:8px">Đăng nhập</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ───
var GAS='https://script.google.com/macros/s/AKfycbzxPXoDhsPYDe7RbBBfGyW8shFxsB3Q6sv7SvxKSP31H9uKOvtGLSyoHRSRUj-jo3Mo/exec';
var GAS_NS='https://script.google.com/macros/s/AKfycbxaGm5eD7bEKMy53ojLWHMXggUacrBJw2k7b7QEhPfBcarFTScPWcoBFjeMZxPYl2pUPQ/exec';
var CSV='https://docs.google.com/spreadsheets/d/1fMmEm1GC9aei_3oeu2vcadPVsUM9ms9eVhm99d7pF8A/gviz/tq?tqx=out:csv&gid=900581387';
var STORAGE_KEY='ns_v1';
var STATUS_OPTIONS=['Đang làm việc','Nghỉ thai sản','Nghỉ không lương','Nghỉ ốm','Đã nghỉ việc','Dự kiến nghỉ việc'];

var cascade={},stores=[],empData={},surveyData={},sel=null,tt;

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2600)}

// ─── INIT ───
(function(){
  document.getElementById('eDate').max=new Date().toISOString().split('T')[0];
  
  // Load survey from localStorage
  try{var raw=localStorage.getItem(STORAGE_KEY);if(raw)surveyData=JSON.parse(raw)}catch(e){surveyData={}}
  
  // Load employee data
  var xhr=new XMLHttpRequest();
  xhr.open('GET','emp-compact.json',true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      if(xhr.status===200||xhr.status===0){try{empData=JSON.parse(xhr.responseText)}catch(e){empData={}}}
      else empData={};
    }
  };
  xhr.send();
  
  // Load store list: try GAS first, fallback to CSV
  fetch(GAS+'?action=storeData').then(function(r){return r.ok?r.json():null}).then(function(rows){
    if(rows&&rows.length){stores=rows;buildC()}
  }).catch(function(){csvF()});
  setTimeout(function(){if(document.getElementById('sg').options.length<=1)csvF()},3000);
})();

function csvF(){
  fetch(CSV).then(function(r){return r.text()}).then(function(t){
    var rows=pCSV(t),arr=[];
    for(var i=0;i<rows.length;i++){var r=rows[i];if((val(r,'Tình Trạng')||'').trim()!=='Đang hoạt động')continue;arr.push({mien:val(r,'Miền')||'',gdv:val(r,'GĐV')||val(r,'GDV')||'',qlkv:val(r,'QLKV')||'',ma:val(r,'Mã SAP')||val(r,'Mã CH')||val(r,'SAP')||'',ten:val(r,'Tên cửa hàng')||val(r,'Tên CH')||'',tinh:val(r,'Tỉnh/TP')||val(r,'Tỉnh')||''})}
    if(arr.length){stores=arr;buildC()}
  }).catch(function(){});
}
function val(obj,key){var v=obj[key];if(v!==undefined)return v;var nk=key.normalize('NFD');for(var k in obj){if(k.normalize('NFC')===key||k.normalize('NFD')===nk)return obj[k]}return undefined}
function pCSV(t){var rows=[],row=[],cur='',iq=false;for(var i=0;i<t.length;i++){var c=t[i];if(iq){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++}else iq=false}else cur+=c}else if(c=='"')iq=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}else cur+=c}row.push(cur);rows.push(row);if(rows.length<2)return[];var h=rows[0].map(function(x){return x.trim()});return rows.slice(1).map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i]});return o})}
function buildC(){
  cascade={};for(var i=0;i<stores.length;i++){var s=stores[i],m=s.mien||'Miền Bắc',g=s.gdv||'CPC',q=s.qlkv||'CPC';if(!cascade[m])cascade[m]={};if(!cascade[m][g])cascade[m][g]={};if(!cascade[m][g][q])cascade[m][g][q]=[];cascade[m][g][q].push(s)}
  var ms=Object.keys(cascade).sort(),se=document.getElementById('sm');
  se.innerHTML='<option value="">-- Chọn Miền --</option>';
  for(var i=0;i<ms.length;i++){var m=ms[i];se.innerHTML+='<option value="'+m+'">'+m+'</option>'}
  document.getElementById('sg').disabled=true;document.getElementById('sq').disabled=true;document.getElementById('sc').disabled=true;
}

// ─── CASCADE ───
document.getElementById('sm').addEventListener('change',function(){
  var m=this.value;document.getElementById('sg').innerHTML='<option value="">-- Chọn GĐV --</option>';document.getElementById('sq').innerHTML='<option value="">-- Chọn QLKV --</option>';document.getElementById('sq').disabled=true;document.getElementById('sc').innerHTML='<option value="">-- Chọn CH --</option>';document.getElementById('sc').disabled=true;document.getElementById('si').style.display='none';
  if(!m||!cascade[m]){document.getElementById('sg').disabled=true;return}document.getElementById('sg').disabled=false;
  var gs=Object.keys(cascade[m]).sort();for(var i=0;i<gs.length;i++){var g=gs[i];document.getElementById('sg').innerHTML+='<option value="'+g+'">'+g+'</option>'}
});
document.getElementById('sg').addEventListener('change',function(){
  var m=document.getElementById('sm').value,g=this.value;document.getElementById('sq').innerHTML='<option value="">-- Chọn QLKV --</option>';document.getElementById('sq').disabled=true;document.getElementById('sc').innerHTML='<option value="">-- Chọn CH --</option>';document.getElementById('sc').disabled=true;document.getElementById('si').style.display='none';
  if(!m||!g||!cascade[m]||!cascade[m][g])return;document.getElementById('sq').disabled=false;
  var qs=Object.keys(cascade[m][g]).sort();for(var i=0;i<qs.length;i++){var q=qs[i];document.getElementById('sq').innerHTML+='<option value="'+q+'">'+q+'</option>'}
});
document.getElementById('sq').addEventListener('change',function(){
  var m=document.getElementById('sm').value,g=document.getElementById('sg').value,q=this.value,ss=document.getElementById('sc');ss.innerHTML='<option value="">-- Chọn CH --</option>';document.getElementById('si').style.display='none';
  if(!m||!g||!q||!cascade[m]||!cascade[m][g]||!cascade[m][g][q]){ss.disabled=true;return}ss.disabled=false;
  var chs=cascade[m][g][q].sort(function(a,b){return(a.ma||'').localeCompare(b.ma||'')});ss.innerHTML='<option value="">-- Chọn Cửa hàng ('+chs.length+') --</option>';for(var i=0;i<chs.length;i++){var c=chs[i];ss.innerHTML+='<option value="'+c.ma+'" data-name="'+c.ten+'" data-tinh="'+c.tinh+'">'+c.ma+' - '+c.ten+'</option>'}
});
document.getElementById('sc').addEventListener('change',function(){
  var o=this.selectedOptions[0];
  if(o&&o.getAttribute('data-name')){
    sel={ma:o.value,ten:o.getAttribute('data-name'),tinh:o.getAttribute('data-tinh')};
    document.getElementById('sMa').textContent=sel.ma;document.getElementById('sTinh').textContent=sel.tinh||'-';document.getElementById('sTen').textContent=sel.ten;document.getElementById('si').style.display='block';
    loadEmpTable();
  }else{sel=null;document.getElementById('si').style.display='none';hideEmp()}
});

// ─── EMPLOYEE TABLE ───
function hideEmp(){
  document.getElementById('empCard').style.display='none';
  document.getElementById('saveCard').style.display='none';
  document.getElementById('empArea').innerHTML='';
}

function loadEmpTable(){
  var area=document.getElementById('empArea');
  area.innerHTML='<div class="empty-msg"><div class="spinner"></div>Đang tải dữ liệu nhân sự...</div>';
  document.getElementById('empCard').style.display='block';
  document.getElementById('saveCard').style.display='block';
  document.getElementById('saveMsg').textContent='';
  document.getElementById('confirmWrap').style.display='none';
  document.getElementById('saveBtnWrap').style.display='block';
  
  // Short delay to let UI update
  setTimeout(function(){
    if(!sel)return;
    var emps=empData[sel.ma];
    if(!emps||emps.length===0){
      area.innerHTML='<div class="empty-msg">⚠️ Không có dữ liệu nhân viên cho cửa hàng này.</div>';
      document.getElementById('empCount').textContent='0 NV';
      document.getElementById('saveCard').style.display='none';
      return;
    }
    document.getElementById('empCount').textContent=emps.length+' NV';
    renderEmpList(emps);
  },100);
}

function renderEmpList(emps){
  var surveyEntry=surveyData[sel.ma];
  var savedEmp=(surveyEntry&&surveyEntry.e)?surveyEntry.e:{};
  var area=document.getElementById('empArea');
  var html='<div class="emp-card">';
  
  for(var i=0;i<emps.length;i++){
    var emp=emps[i],hasSurvey=(savedEmp[emp.m]!==undefined),isCorrect=hasSurvey?savedEmp[emp.m].correct!==false:null;
    var sysCls=(emp.t==='Đang làm việc')?'working':((emp.t==='Đã nghỉ việc'||emp.t==='Dự kiến nghỉ việc')?'leave':'other');
    
    html+='<div class="emp-row" id="erow-'+i+'">';
    html+='<div class="emp-name"><b>'+emp.m+'</b> '+emp.n+'</div>';
    html+='<div class="emp-title">'+emp.c+'</div>';
    html+='<span class="sys-badge '+sysCls+'">'+emp.t+'</span>';
    
    // Time info
    if((emp.t.indexOf('Đã nghỉ')>=0||emp.t.indexOf('Dự kiến')>=0)&&emp.ed){
      html+='<span style="font-size:10px;color:var(--muted)">'+emp.ed+'</span>';
    }else if((emp.t.indexOf('thai')>=0||emp.t.indexOf('ốm')>=0||emp.t.indexOf('không')>=0)&&emp.sd){
      html+='<span style="font-size:10px;color:var(--muted)">'+(emp.sd||'')+' - '+(emp.ed||'')+'</span>';
    }
    
    // Status column
    html+='<div class="cf-btn-group" style="margin-left:auto" id="btns-'+i+'">';
    
    // Saved: correct
    if(isCorrect===true){

function onExStatusChange(idx){
  var sel=document.getElementById('exs-'+idx);
  if(!sel)return;
  var v=sel.value;
  var ds=document.getElementById('exds-'+idx),de=document.getElementById('exde-'+idx),hr=document.getElementById('exhr-'+idx);
  var isLeave=(v.indexOf('thai')>=0||v.indexOf('ốm')>=0||v.indexOf('không')>=0);
  var isResign=(v.indexOf('Đã nghỉ')>=0||v.indexOf('Dự kiến')>=0);
  
  var dw=document.getElementById('exd-'+idx);
  var lbls=dw.querySelectorAll('.cf-date-lbl');
  var divs=dw.querySelectorAll('div');
  
  if(isLeave){
    lbls[0].textContent='Từ:';divs[0].style.display='';divs[1].style.display='';
  }else if(isResign){
    lbls[0].textContent='Ngày:';divs[0].style.display='';divs[1].style.display='none';
  }else{
    divs[0].style.display='none';divs[1].style.display='none';
  }
  
  var hrDiv=hr.parentNode;
  hrDiv.style.display=(isLeave||isResign)?'':'none';
}

function markCorrect(idx){
  document.getElementById('hv-'+idx).value='correct';
  document.getElementById('dung-'+idx).className='cf-btn cf-ok';
  document.getElementById('sai-'+idx).className='cf-btn';
  document.getElementById('ex-'+idx).classList.remove('show');
}
function markIncorrect(idx){
  document.getElementById('hv-'+idx).value='incorrect';
  document.getElementById('dung-'+idx).className='cf-btn';
  document.getElementById('sai-'+idx).className='cf-btn cf-err';
  document.getElementById('ex-'+idx).classList.add('show');
}

function confirmEmp(idx){
  var s=document.getElementById('exs-'+idx).value;
  var sd=document.getElementById('exds-'+idx).value,ed=document.getElementById('exde-'+idx).value;
  var hr=document.getElementById('exhr-'+idx).checked;
  var isLeave=(s.indexOf('thai')>=0||s.indexOf('ốm')>=0||s.indexOf('không')>=0);
  var isResign=(s.indexOf('Đã nghỉ')>=0||s.indexOf('Dự kiến')>=0);
  
  if(isLeave&&(!sd||!ed)){toast('⚠️ Vui lòng nhập đủ ngày bắt đầu và kết thúc!');return}
  if(isResign&&!sd){toast('⚠️ Vui lòng nhập ngày nghỉ!');return}
  
  var desc=s;
  if(sd)desc+=' '+sd;
  if(ed&&isLeave)desc+=' - '+ed;
  desc+=' '+(hr?'ĐGĐ':'CĐ');
  
  // Hide extra form
  document.getElementById('ex-'+idx).classList.remove('show');
  
  // Hide Dung/Sai buttons
  document.getElementById('dung-'+idx).style.display='none';
  document.getElementById('sai-'+idx).style.display='none';
  
  // Show updated badge
  var btns=document.getElementById('btns-'+idx);
  var badge=document.createElement('span');
  badge.className='saved-badge sai';
  badge.id='upd-'+idx;
  badge.textContent='⚠ '+desc;
  var editLink=document.createElement('span');
  editLink.className='edit-link';
  editLink.textContent='Sửa';
  editLink.onclick=(function(i){return function(e){reEdit(i,false)}})(idx);
  btns.appendChild(badge);
  btns.appendChild(editLink);
  
  // Update hidden value
  document.getElementById('hv-'+idx).value='incorrect';
}

function reEdit(idx,wasCorrect){
  var ex=document.getElementById('ex-'+idx);
  var dung=document.getElementById('dung-'+idx),sai=document.getElementById('sai-'+idx);
  
  // Remove saved badges
  var done=document.getElementById('done-'+idx),upd=document.getElementById('upd-'+idx);
  if(done)done.remove();if(upd)upd.remove();
  // Remove edit links (only those adjacent)
  var btns=document.getElementById('btns-'+idx);
  var links=btns.querySelectorAll('.edit-link');
  for(var i=0;i<links.length;i++)links[i].remove();
  
  // Show buttons
  if(dung)dung.style.display='';if(sai)sai.style.display='';
  
  if(wasCorrect){
    document.getElementById('hv-'+idx).value='correct';
    if(dung)dung.className='cf-btn cf-ok';
    if(sai)sai.className='cf-btn';
    ex.classList.remove('show');
  }else{
    document.getElementById('hv-'+idx).value='incorrect';
    if(dung)dung.className='cf-btn';
    if(sai)sai.className='cf-btn cf-err';
    ex.classList.add('show');
  }
}

function triggerSave(){
  if(!sel)return;
  var emps=empData[sel.ma];
  if(!emps||emps.length===0)return;
  
  // Validate all employees confirmed
  var allConfirmed=true,total=emps.length,correct=0,incorrect=0;
  for(var i=0;i<emps.length;i++){
    var hv=document.getElementById('hv-'+i);
    if(!hv||!hv.value||(hv.value!=='correct'&&hv.value!=='incorrect')){allConfirmed=false;break}
    if(hv.value==='correct')correct++;else incorrect++;
  }
  // Also check already-done badges
  for(var i=0;i<emps.length;i++){
    var done=document.getElementById('done-'+i),upd=document.getElementById('upd-'+i);
    if(done){correct++}
    if(upd){incorrect++}
  }
  if(!allConfirmed){
    // But if some have badges, we can proceed
    var hasBadges=(document.getElementById('done-0')||document.getElementById('upd-0'));
    // Count total confirmed
    var totalCf=0;
    for(var i=0;i<emps.length;i++){
      var hv=document.getElementById('hv-'+i),done=document.getElementById('done-'+i),upd=document.getElementById('upd-'+i);
      if((hv&&hv.value==='correct')||done)totalCf++;
      if((hv&&hv.value==='incorrect')||upd)totalCf++;
    }
    if(totalCf<emps.length){toast('⚠️ Vui lòng xác nhận tất cả nhân viên trước khi lưu!');return}
  }
  
  // Show confirm
  var cw=document.getElementById('confirmWrap');
  document.getElementById('saveBtnWrap').style.display='none';
  cw.style.display='block';
  
  var tCorrect=0,tIncorrect=0;
  for(var i=0;i<emps.length;i++){
    var hv=document.getElementById('hv-'+i),done=document.getElementById('done-'+i),upd=document.getElementById('upd-'+i);
    if((hv&&hv.value==='correct')||done)tCorrect++;
    else tIncorrect++;
  }
  
  cw.innerHTML='<div class="confirm-box">'+
    '<h3 style="font-size:15px;color:#166534;margin-bottom:8px">📋 Xác nhận Lưu khảo sát</h3>'+
    '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">'+sel.ten+' ('+sel.ma+')</div>'+
    '<table style="width:100%;font-size:12px;margin:8px 0"><tr><td style="color:var(--muted);width:50%">👥 Tổng NV rà soát</td><td><b>'+emps.length+'</b></td></tr>'+
    '<tr><td style="color:var(--muted)">✅ Xác nhận đúng</td><td><b style="color:var(--green)">'+tCorrect+'</b></td></tr>'+
    '<tr><td style="color:var(--muted)">⚠️ Điều chỉnh</td><td><b style="color:#d97706">'+tIncorrect+'</b></td></tr></table>'+
    '<div class="confirm-acts">'+
    '<button class="btn btn-ghost" onclick="cancelSave()">❌ Huỷ</button>'+
    '<button class="btn btn-green" onclick="doSave()">✅ Xác nhận Lưu</button>'+
    '</div></div>';
}

function cancelSave(){
  document.getElementById('confirmWrap').style.display='none';
  document.getElementById('saveBtnWrap').style.display='block';
}

function doSave(){
  var emps=empData[sel.ma];
  if(!emps)return;
  
  var empResult={};
  for(var i=0;i<emps.length;i++){
    var emp=emps[i];
    var hv=document.getElementById('hv-'+i),done=document.getElementById('done-'+i),upd=document.getElementById('upd-'+i);
    var isCorrect=true;
    
    if(done)isCorrect=true;
    else if(upd){isCorrect=false}
    else if(hv){isCorrect=(hv.value==='correct')}
    
    empResult[emp.m]={correct:isCorrect,note:''};
    
    if(!isCorrect){
      var exs=document.getElementById('exs-'+i),exds=document.getElementById('exds-'+i),exde=document.getElementById('exde-'+i),exhr=document.getElementById('exhr-'+i);
      empResult[emp.m].s=exs?exs.value:'';
      empResult[emp.m].startDate=exds?exds.value:'';
      empResult[emp.m].endDate=exde?exde.value:'';
      empResult[emp.m].sentHR=exhr?exhr.checked:false;
    }
  }
  
  surveyData[sel.ma]={ts:new Date().toISOString(),e:empResult};
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(surveyData))}catch(e){}
  
  // Push to GAS
  pushToGAS(empResult);
  
  document.getElementById('saveMsg').textContent='✅ Đã lưu thành công!';
  cancelSave();
  toast('✅ Đã lưu khảo sát thành công!');
  
  // Reload to show saved state
  setTimeout(function(){if(sel){renderEmpList(emps);document.getElementById('saveMsg').textContent=''}},500);
}

function pushToGAS(empResult){
  var emps=empData[sel.ma]||[];
  var empMeta={};
  for(var i=0;i<emps.length;i++){var e=emps[i];empMeta[e.m]={n:e.n||'',c:e.c||'',t:e.t||''}}
  var payload={maCost:sel.ma,tenCH:sel.ten,gdv:document.getElementById('sg').value,qlkv:document.getElementById('sq').value,tinh:sel.tinh||'',ts:new Date().toISOString(),employees:empResult,empMeta:empMeta};
  try{
    var xhr=new XMLHttpRequest();
    xhr.open('POST',GAS_NS,true);
    xhr.setRequestHeader('Content-Type','text/plain;charset=utf-8');
    xhr.send(JSON.stringify(payload));
  }catch(e){}
}

function buildLocalDash(){
  // Build dashboard from localStorage surveyData
  if(stores.length===0){document.getElementById('tabDash').innerHTML='<div class="wrap" style="text-align:center;padding:40px;color:var(--red)">⚠️ Chưa có dữ liệu cửa hàng</div>';return}
  
  var summary={totalCH:stores.length,surveyedCH:0,totalIssues:0,resolved:0,pctSurveyed:0,pctResolved:0};
  var byGdv={},byQlkv={};
  
  for(var i=0;i<stores.length;i++){
    var s=stores[i],g=s.gdv||'CPC',q=s.qlkv||'CPC';
    if(!byGdv[g])byGdv[g]={gdv:g,totalCH:0,surveyed:0,totalIssues:0,resolved:0};
    byGdv[g].totalCH++;
    if(!byQlkv[q])byQlkv[q]={qlkv:q,gdv:g,totalCH:0,surveyed:0,totalIssues:0,resolved:0};
    byQlkv[q].totalCH++;
    
    var sv=surveyData[s.ma];
    if(sv&&sv.e){
      summary.surveyedCH++;byGdv[g].surveyed++;byQlkv[q].surveyed++;
      var emps=empData[s.ma]||[];
      for(var j=0;j<emps.length;j++){
        var emp=emps[j],se=sv.e[emp.m];
        if(se&&se.correct===false){summary.totalIssues++;byGdv[g].totalIssues++;byQlkv[q].totalIssues++}
      }
    }
  }
  
  summary.pctSurveyed=summary.totalCH>0?Math.round(summary.surveyedCH/summary.totalCH*100):0;
  summary.pctResolved=0;summary.resolved=0; // No "resolved" concept in nhansu - issues are discrepancies
  
  // Compute percentages
  var gdvList=[];
  for(var k in byGdv){
    var g=byGdv[k];g.notSurveyed=g.totalCH-g.surveyed;g.pctSurveyed=g.totalCH>0?Math.round(g.surveyed/g.totalCH*100):0;
    g.unresolved=g.totalIssues-g.resolved;g.pctResolved=g.totalIssues>0?Math.round(g.resolved/g.totalIssues*100):100;
    gdvList.push(g);
  }
  gdvList.sort(function(a,b){return b.totalCH-a.totalCH});
  
  var qlkvList=[];
  for(var k in byQlkv){
    var q=byQlkv[k];q.pctSurveyed=q.totalCH>0?Math.round(q.surveyed/q.totalCH*100):0;
    qlkvList.push(q);
  }
  qlkvList.sort(function(a,b){return b.totalCH-a.totalCH});
  
  dData={ok:true,summary:summary,byGdv:gdvList,byQlkv:qlkvList,updated:Date.now()};
  renderDash();
}

    html+='<td style="text-align:center;padding:6px 6px">'+g.surveyed+'</td>';
    html+='<td style="text-align:center;padding:6px 6px">'+g.notSurveyed+'</td>';
    html+='<td style="text-align:center;padding:6px 6px"><span class="tag-sm '+tag+'">'+g.pctSurveyed+'%</span><span class="bar-wrap"><span class="bar '+c+'" style="width:'+Math.max(g.pctSurveyed,2)+'%"></span></span></td>';
    html+='<td style="text-align:center;padding:6px 6px;color:#d97706;font-weight:600">'+g.totalIssues+'</td></tr>';
  }
  html+='</tbody></table></div></div></div>';
  
  // QLKV table
  html+='<div class="tab-view" id="dTabQLKV"><div class="card" style="margin-top:8px">';
  html+='<div class="card-head"><span class="dot" style="background:var(--green)"></span>Theo QLKV</div><div class="card-body" style="padding:0;max-height:500px;overflow-y:auto">';
  html+='<table style="width:100%;font-size:12px;border-collapse:collapse"><thead><tr style="background:#f9fafb"><th style="text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)">QLKV</th><th style="text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)">GĐV</th><th style="text-align:center;padding:8px 6px;border-bottom:1px solid var(--border)">CH</th><th style="text-align:center;padding:8px 6px;border-bottom:1px solid var(--border)">Đã KS</th><th style="text-align:center;padding:8px 6px;border-bottom:1px solid var(--border)">%</th><th style="text-align:center;padding:8px 6px;border-bottom:1px solid var(--border)">⚠️</th></tr></thead><tbody>';
  
  var vQ=dData.byQlkv.slice();
  if(dUser.role==='gdv')vQ=vQ.filter(function(q){return q.gdv===dUser.gdv});
  for(var i=0;i<vQ.length;i++){
    var q=vQ[i],tKS=q.pctSurveyed>=80?'ok':(q.pctSurveyed>=50?'warn':'bad');
    html+='<tr style="border-bottom:1px solid #f0f0f0"><td style="padding:6px 10px"><b>'+q.qlkv+'</b></td>';
    html+='<td style="padding:6px 10px;font-size:11px;color:var(--muted)">'+q.gdv+'</td>';
    html+='<td style="text-align:center;padding:6px 6px">'+q.totalCH+'</td>';
    html+='<td style="text-align:center;padding:6px 6px">'+q.surveyed+'</td>';
    html+='<td style="text-align:center;padding:6px 6px"><span class="tag-sm '+tKS+'">'+q.pctSurveyed+'%</span></td>';
    html+='<td style="text-align:center;padding:6px 6px;color:#d97706;font-weight:600">'+q.totalIssues+'</td></tr>';
  }
  html+='</tbody></table></div></div></div>';
  
  html+='<div style="text-align:center;font-size:10px;color:var(--muted);margin-top:16px;padding-bottom:20px">Cập nhật: '+new Date(dData.updated).toLocaleString('vi-VN')+'</div>';
  html+='</div>';
  document.getElementById('tabDash').innerHTML=html;
}

function dashLogout(){dUser=null;dData=null;resetDashLogin()}

function switchDashTab(tab,el){
  var tabs=document.querySelectorAll('#tabDash .main-tab');
  var views=document.querySelectorAll('#tabDash .tab-view');
  tabs.forEach(function(t){t.classList.remove('active')});
  views.forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  document.getElementById('dTab'+(tab.toUpperCase())).classList.add('active');
}
</script>
</body>
